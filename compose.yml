services:
  backend:
    build: ./backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - AI_PROVIDER=anthropic
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
    name: persistent_data
